    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        perspective: 1400px;
      }
      /* Full-bleed child, never the root itself: the producer's frame
         compositing can drop a background set on the composition root, which
         renders black even though preview and snapshot look correct. */
      #stage-fill {
        position: absolute;
        inset: 0;
        background: #0B1220;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
      }
    </style>
  </head>
